# Deploys the site to GitHub Pages on every push to main.
#
# Why this exists: the Settings -> Pages "Deploy from a branch" option can end up
# in a stuck state (most often after unpublishing). With this workflow committed,
# set Source to "GitHub Actions" instead and deployment stops depending on that
# branch picker entirely. You can also trigger it by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # index.html sits at the repo root, so the whole repo is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
